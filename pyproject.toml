[project]
name = "patienttriage-round2"
version = "0.1.0"
description = "Offline, safety-first PatientTriage.ai Round 2 prototype"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.37",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "shap>=0.46",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
